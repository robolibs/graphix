[package]
name = "graphix"
version = "0.1.6"
edition = "2024"
description = "Rust graph library combining vertex graphs and factor graphs"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[[bench]]
name = "core_workloads"
harness = false

[dependencies]
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.6.2" }
glam = "0.33.0"
kiddo = "4.2"
nalgebra = "0.33"
rayon = "1.10"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }

[[example]]
name = "astar"
path = "examples/rust/astar.rs"

